name: Daily Coin Report

on:
  schedule:
    # GitHub cron is UTC. 13:00 UTC is 22:00 Asia/Seoul.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-coin-alerts
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_COIN_F1318: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COIN_F1318 }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      SITE_URL: https://dot.sanghak.kr
      DAILY_REPORT: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm --prefix functions ci

      - name: Check report secrets
        run: |
          missing=0
          for key in FIREBASE_SERVICE_ACCOUNT_COIN_F1318 KAKAO_REST_API_KEY KAKAO_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Send daily Kakao report
        run: node scripts/github-scheduled-alert.mjs
